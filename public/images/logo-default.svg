<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <!-- Background Squircle / Shield -->
    <rect x="6" y="6" width="108" height="108" rx="28" fill="#0F172A"/>
    <rect x="6" y="6" width="108" height="108" rx="28" stroke="#334155" stroke-width="2"/>
    
    <!-- Subtle Inner Glow -->
    <circle cx="60" cy="40" r="45" fill="#1E293B" opacity="0.6"/>
    
    <!-- Ballot Box Base -->
    <path d="M30 52 L90 52 L84 94 L36 94 Z" fill="#1E293B" stroke="#64748B" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Ballot Slot Accent -->
    <rect x="42" y="52" width="36" height="4" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Ballot Card Dropping In -->
    <rect x="40" y="22" width="40" height="36" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
    
    <!-- Checkmark on Ballot Card -->
    <circle cx="60" cy="40" r="10" fill="#ECFDF5"/>
    <path d="M55 40 L58.5 43.5 L65.5 36.5" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Security / Verified Dot Badge -->
    <circle cx="86" cy="34" r="6" fill="#10B981"/>
    <path d="M83.5 34 L85 35.5 L88.5 32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
